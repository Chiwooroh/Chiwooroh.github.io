<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img"
     aria-label="On the left, a simulated two-lane road seen from above. A broken-down vehicle sits in the right-hand lane with its hazards on and a warning triangle behind it, while traffic keeps flowing in the other lane. The automated vehicle eases off on the approach, waits for a gap in that traffic, changes lane into it and passes the broken-down vehicle. On the right, two traces recorded from that run: its speed, which stays under the posted limit, and its time-to-collision, which bottoms out at 2.7 seconds, above the 1.5-second critical threshold.">

  <style>
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .still { display: inline; } }
    .still { display: none; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
            font-size: 22px; letter-spacing: 3px; }
    .unit { font-family: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace; font-size: 11px; letter-spacing: 1px; }
    .sub { font-family: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
            font-size: 13px; letter-spacing: 2px; }
  </style>

  <defs>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="rgba(255,255,255,.025)"/>
    </pattern>
    <radialGradient id="glow2" cx="34%" cy="52%" r="54%">
      <stop offset="0" stop-color="#7FB0EB" stop-opacity=".08"/>
      <stop offset="1" stop-color="#7FB0EB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scene"><rect x="0" y="46" width="608" height="314"/></clipPath>
    <path id="avPath" d="M-80 210 H120 C 205 210 205 160 290 160 H857.6"/>
    <path id="upLane" d="M-80 160 H880"/>
  </defs>

  <rect width="960" height="360" fill="#0E1013"/>
  <rect width="960" height="360" fill="url(#grid2)"/>
  <rect width="960" height="360" fill="url(#glow2)"/>

  <text class="tag" x="16"  y="34" fill="#6B7280">SIMULATION</text>
  <text class="tag" x="640" y="34" fill="#DE9A53">EVALUATION</text>
  <path d="M620 56 V330" stroke="rgba(255,255,255,.10)" stroke-width="1.5"/>

  <!-- ============================ the run ============================ -->
  <g clip-path="url(#scene)">
    <rect x="0" y="135" width="608" height="100" fill="#16191D"/>
    <path d="M0 135 H608 M0 235 H608" stroke="rgba(255,255,255,.24)" stroke-width="1.5"/>
    <path d="M0 185 H608" stroke="rgba(255,255,255,.16)" stroke-width="1.5" stroke-dasharray="22 18">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="1.1s" repeatCount="indefinite"/>
    </path>

    <!-- the blocked stretch of the right-hand lane -->
    <path d="M300 210 H418" stroke="#DE9A53" stroke-width="28" stroke-linecap="round" opacity=".16"/>

    <!-- broken down: hazards on, triangle out behind it -->
    <circle cx="440" cy="210" r="14" fill="none" stroke="#E5675B" stroke-width="1.2" class="motion">
      <animate attributeName="r" values="16;58" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M384 201 L393 217 L375 217 Z" fill="none" stroke="#DE9A53" stroke-width="2" stroke-linejoin="round"/>
    <rect x="421" y="200" width="38" height="20" rx="4" fill="#E5675B"/>
    <g fill="#DE9A53">
      <rect x="416" y="198" width="5" height="5" rx="1"/><rect x="416" y="217" width="5" height="5" rx="1"/>
      <rect x="459" y="198" width="5" height="5" rx="1"/><rect x="459" y="217" width="5" height="5" rx="1"/>
      <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.45;0.5;1" dur="0.9s" repeatCount="indefinite"/>
    </g>

    <!-- traffic in the other lane, which does not stop for anyone -->
    <g class="motion" fill="#7F858D">
      <g><animateMotion dur="12s" begin="-10.40s" repeatCount="indefinite"><mpath href="#upLane"/></animateMotion><rect x="-19" y="-10" width="38" height="20" rx="4"/></g>
      <g><animateMotion dur="12s" begin="-1.40s" repeatCount="indefinite"><mpath href="#upLane"/></animateMotion><rect x="-19" y="-10" width="38" height="20" rx="4"/></g>
      <g><animateMotion dur="12s" begin="-4.40s" repeatCount="indefinite"><mpath href="#upLane"/></animateMotion><rect x="-19" y="-10" width="38" height="20" rx="4"/></g>
      <g><animateMotion dur="12s" begin="-7.40s" repeatCount="indefinite"><mpath href="#upLane"/></animateMotion><rect x="-19" y="-10" width="38" height="20" rx="4"/></g>
    </g>

