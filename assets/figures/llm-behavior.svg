<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img"
     aria-label="Two two-lane roads with the same number of vehicles and the same average speed. Under a rule-based model every gap stays identical and nobody changes lane. Under a model learned from data the vehicles surge and ease off, so the gaps open and close in a wave, and two of them change lane to overtake.">

  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .still  { display: inline; }
    }
    .still { display: none; }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
      font-size: 22px; letter-spacing: 3px;
    }
  </style>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="rgba(255,255,255,.025)"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="78%" r="62%">
      <stop offset="0" stop-color="#7FB0EB" stop-opacity=".09"/>
      <stop offset="1" stop-color="#7FB0EB" stop-opacity="0"/>
    </radialGradient>

    <path id="rA" d="M-40 76  H1000"/>
    <path id="rB" d="M-40 130 H1000"/>

    <path id="aA" d="M-40 254 H1000"/>
    <path id="aB" d="M-40 308 H1000"/>
    <!-- one pulls out to overtake and tucks back in; one just moves over -->
    <path id="aW1" d="M-40 308 H250 C 322 308 334 254 406 254 H650 C 722 254 734 308 806 308 H1000"/>
    <path id="aW2" d="M-40 254 H470 C 542 254 554 308 626 308 H1000"/>
  </defs>

  <rect width="960" height="360" fill="#0E1013"/>
  <rect width="960" height="360" fill="url(#grid)"/>
  <rect width="960" height="360" fill="url(#glow)"/>

  <!-- ===================== rule-based ===================== -->
  <text class="tag" x="16" y="34" fill="#6B7280">RULE-BASED</text>
  <rect x="0" y="48" width="960" height="110" fill="#111316"/>
  <path d="M0 48 H960 M0 158 H960" stroke="rgba(255,255,255,.26)" stroke-width="1.5"/>
  <path d="M0 103 H960" stroke="rgba(255,255,255,.18)" stroke-width="1.5" stroke-dasharray="26 22">
    <animate attributeName="stroke-dashoffset" values="0;48" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <!-- constant speed, so every gap is the same gap, forever -->
  <g class="motion" fill="#5A6068">
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="0s" repeatCount="indefinite"><mpath href="#rA"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-2.5s" repeatCount="indefinite"><mpath href="#rA"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-5s" repeatCount="indefinite"><mpath href="#rA"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-7.5s" repeatCount="indefinite"><mpath href="#rA"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="0s" repeatCount="indefinite"><mpath href="#rB"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-2.5s" repeatCount="indefinite"><mpath href="#rB"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-5s" repeatCount="indefinite"><mpath href="#rB"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-7.5s" repeatCount="indefinite"><mpath href="#rB"/></animateMotion></g>
  </g>
  <g class="still" fill="#5A6068">
    <rect x="40" y="70" width="22" height="11" rx="3"/><rect x="280" y="70" width="22" height="11" rx="3"/><rect x="520" y="70" width="22" height="11" rx="3"/><rect x="760" y="70" width="22" height="11" rx="3"/>
    <rect x="40" y="124" width="22" height="11" rx="3"/><rect x="280" y="124" width="22" height="11" rx="3"/><rect x="520" y="124" width="22" height="11" rx="3"/><rect x="760" y="124" width="22" height="11" rx="3"/>
  </g>

  <!-- ===================== learned ===================== -->
  <text class="tag" x="16" y="212" fill="#7FB0EB">AI-BASED</text>
  <rect x="0" y="226" width="960" height="110" fill="#111316"/>
  <path d="M0 226 H960 M0 336 H960" stroke="rgba(255,255,255,.26)" stroke-width="1.5"/>
  <path d="M0 281 H960" stroke="rgba(255,255,255,.18)" stroke-width="1.5" stroke-dasharray="26 22">
    <animate attributeName="stroke-dashoffset" values="0;48" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <!-- the overtaking paths, drawn so the crossing shows even in a still frame -->
  <g fill="none" stroke="#7FB0EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 7" opacity=".4">
    <use href="#aW1"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".8s" repeatCount="indefinite"/></use>
    <use href="#aW2"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".8s" repeatCount="indefinite"/></use>
  </g>

  <!-- Same count, same average speed, same spacing at t=0. The only difference
       is that progress along the lane surges and eases, so the gaps breathe
       and the compression travels back down the platoon. -->
  <g class="motion" fill="#7FB0EB">
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aA"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-2.5s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aA"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-7.5s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aA"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-1.25s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aB"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-3.75s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aB"/></animateMotion></g>
    <g><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-8.75s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aB"/></animateMotion></g>
    <g><circle r="19" opacity=".13"/><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-6.25s" repeatCount="indefinite" rotate="auto" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aW1"/></animateMotion></g>
    <g><circle r="19" opacity=".13"/><rect x="-11" y="-5.5" width="22" height="11" rx="3"/>
      <animateMotion dur="10s" begin="-5.0s" repeatCount="indefinite" rotate="auto" calcMode="linear"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        keyPoints="0;0.0878;0.1608;0.2128;0.2500;0.2872;0.3392;0.4122;0.5000;0.5878;0.6608;0.7128;0.7500;0.7872;0.8392;0.9122;1"><mpath href="#aW2"/></animateMotion></g>
  </g>

  <g class="still" fill="#7FB0EB">
    <rect x="49"  y="248.5" width="22" height="11" rx="3"/>
    <rect x="254" y="248.5" width="22" height="11" rx="3"/>
    <rect x="774" y="248.5" width="22" height="11" rx="3"/>
    <rect x="175" y="302.5" width="22" height="11" rx="3"/>
    <rect x="389" y="302.5" width="22" height="11" rx="3"/>
    <rect x="909" y="302.5" width="22" height="11" rx="3"/>
    <g transform="translate(709 269) rotate(28.8)"><circle r="19" opacity=".13"/><rect x="-11" y="-5.5" width="22" height="11" rx="3"/></g>
    <g transform="translate(577 298) rotate(24.5)"><circle r="19" opacity=".13"/><rect x="-11" y="-5.5" width="22" height="11" rx="3"/></g>
  </g>

</svg>
